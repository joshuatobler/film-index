<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Index</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://kit.fontawesome.com/401f019805.js" crossorigin="anonymous"></script>
  <script src="index.js"></script>
</head>

<body>
  <section id="landing">
    <nav>
      <div class="nav__container">
        <a href="index.html">
          <h1 class="logo">
            Film Index
          </h1>
        </a>
        <ul class="nav__links">
          <li><a href="index.html" class="nav__link">Home</a></li>
          <li><a href="movies.html" class="nav__link">Movies</a></li>
          <li><a class="nav__link nav__link--primary">Contact</a></li>
        </ul>
        <button class="btn__menu" onclick="openMenu()">
          <i class="fas fa-bars"></i>
        </button>
        <div class="menu__backdrop">
          <button class="btn__menu btn__menu--close" onclick="closeMenu()">
            <i class="fas fa-times"></i>
          </button>
          <ul class="menu__links">
            <li class="menu__list">
              <a href="index.html" class="menu__link" onclick="closeMenu()">Home</a>
            </li>
            <li class="menu__list">
              <a href="movies.html" class="menu__link" onclick="closeMenu()">Movies</a>
            </li>
            <li class="menu__list">
              <a class="menu__link no-cursor" onclick="closeMenu()">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <header>
      <div class="header__container">
        <div class="header__description">
          <h1>Data-Driven Film Discovery</h1>
          <h2>Find your next movie with <span class="purple">Film Index</span></h2>
          <a href="movies.html">
            <button class="btn">Explore movies</button>
          </a>
        </div>
        <figure class="header__img--wrapper">
          <img src="assets/undraw_movie.svg" alt="">
        </figure>
      </div>
    </header>
  </section>

  <footer>
    <div class="container">
      <div class="row row__column">
        <a href="index.html">
          <h1 class="logo">
            Film Index
          </h1>
        </a>
        <div class="footer__list">
          <a href="index.html" class="footer__link">Home</a>
          <a href="movies.html" class="footer__link">Movies</a>
          <a class="footer__link no-cursor">Contact</a>
        </div>
        <div class="footer__copyright">Copyright &copy; 2026 Joshua Tobler</div>
      </div>
    </div>
  </footer>
</body>
</html>
